<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Mi Gestor de Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .animacion-suave {
            animation: aparecer 0.5s ease-out forwards;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body, .card, .btn, .list-group-item, input {
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease !important;
        }
        :root {
            --color-marca: #4f46e5; 
            --color-marca-hover: #4338ca;
        }

        [data-bs-theme="dark"] body {
            background-color: #0f172a; 
            color: #f8fafc;
        }
        [data-bs-theme="dark"] .card {
            background-color: #1e293b;
            border-color: #334155;
        }
        [data-bs-theme="dark"] .form-control {
            background-color: #0f172a;
            border-color: #334155;
            color: white;
        }
        [data-bs-theme="dark"] .form-control::placeholder {
            color: #64748b; 
        }

        .btn-marca {
            background-color: var(--color-marca);
            color: white;
            border: none;
        }
        .btn-marca:hover {
            background-color: var(--color-marca-hover);
            color: white;
        }
        
        .caja-total {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .lista-gastos-item {
            transition: transform 0.2s;
        }
        .lista-gastos-item:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body class="py-4">
    
<div id="login-pantalla" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow border-0 rounded-4">
                    <h3 class="text-center mb-4 fw-bold" id="auth-titulo">🔐 Iniciar Sesión</h3>
                    
                    <div id="alerta-auth" class="alert d-none text-center" role="alert"></div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <input type="text" id="auth-usuario" class="form-control" placeholder="Ingresa tu usuario">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" id="auth-password" class="form-control" placeholder="********">
                    </div>
                    
                    <button id="btn-auth" class="btn btn-marca w-100 fw-bold py-2 mb-3" onclick="procesarAuth()">Entrar al Sistema</button>
                    
                    <div class="text-center">
                        <a href="#" id="link-auth" class="text-decoration-none fw-bold" style="color: var(--color-marca);" onclick="alternarModoAuth()">¿No tienes cuenta? Regístrate aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-principal" class="container d-none" style="max-width: 600px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">💸 Gestor de Gastos</h2>
            <div>
                <button class="btn btn-sm btn-outline-danger me-2" onclick="cerrarSesion()" title="Cerrar Sesión">Cerrar Sesión</button>
                <button class="btn btn-outline-secondary rounded-circle" onclick="alternarTema()" id="btn-tema" title="Cambiar tema">🌙</button>
            </div>
        </div>

        <div class="caja-total text-center mb-4">
            <p class="mb-1 text-white-50 fw-bold">BALANCE TOTAL</p>
            <h1 class="display-4 fw-bold mb-0">$<span id="balance">0</span></h1>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-3 text-center">
                <h6 class="fw-bold text-secondary mb-3">Distribución por Categoría</h6>
                <canvas id="graficoGastos" style="max-height: 250px; width: 100%;"></canvas>
            </div>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Nuevo Movimiento</h5>
                <div id="alerta-errores" class="alert alert-danger d-none" role="alert">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-8">
                        <input type="text" id="desc" class="form-control" placeholder="Descripción (Ej: Steam, Almuerzo...)">
                    </div>
                    <div class="col-md-4">
                        <input type="number" id="monto" class="form-control" placeholder="Monto ($)">
                    </div>
                </div>
                
                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <input type="text" id="cat" class="form-control" placeholder="Categoría">
                    </div>
                    <div class="col-md-6">
                        <input type="date" id="fecha" class="form-control">
                    </div>
                </div>
                
                <button id="btn-guardar" class="btn btn-marca w-100 fw-bold py-2" onclick="guardarGasto()">Registrar Movimiento</button>            
                <button id="btn-cancelar" class="btn btn-outline-secondary w-100 fw-bold py-2 mt-2 d-none" onclick="cancelarEdicion()">Cancelar Edición</button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Historial Reciente</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="obtenerDatos()">🔄 Refrescar</button>
        </div>
        
        <ul id="lista-gastos" class="list-group shadow-sm mb-5">
        </ul>

    </div>

    <script>
        // --- LOGICA DEL MODO OSCURO ---
        function detectarHoraYTema() {
            const hora = new Date().getHours();
            const html = document.documentElement;
            const btnTema = document.getElementById('btn-tema');
            if (hora >= 19 || hora < 7) {
                html.setAttribute('data-bs-theme', 'dark');
                btnTema.innerText = '☀️';
            } else {
                html.setAttribute('data-bs-theme', 'light');
                btnTema.innerText = '🌙';
            }
        }

        function alternarTema() {
            const html = document.documentElement;
            const btnTema = document.getElementById('btn-tema');
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                btnTema.innerText = '🌙';
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                btnTema.innerText = '☀️';
            }
        }
        detectarHoraYTema();

        // --- VARIABLES GLOBALES ---
        let listaGastosGlobal = []; 
        let gastoEnEdicionId = null; 
        let miGraficoVisual = null; 


        // SISTEMA DE SEGURIDAD (LOGIN Y TOKENS)
        
        // Esta función agarra el Token guardado y se lo pega a las peticiones
        function getAuthHeaders() {
            const token = localStorage.getItem('miTokenVIP');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

       let modoRegistro = false; // Controla si estamos en la pantalla de login o de registro

        function alternarModoAuth(ocultarAlerta = true) {
            modoRegistro = !modoRegistro; 
            document.getElementById('auth-titulo').innerText = modoRegistro ? '📝 Crear Cuenta' : '🔐 Iniciar Sesión';
            document.getElementById('btn-auth').innerText = modoRegistro ? 'Registrarme' : 'Entrar al Sistema';
            document.getElementById('btn-auth').className = modoRegistro ? 'btn btn-success w-100 fw-bold py-2 mb-3' : 'btn btn-marca w-100 fw-bold py-2 mb-3';
            document.getElementById('link-auth').innerText = modoRegistro ? '¿Ya tienes cuenta? Inicia sesión aquí' : '¿No tienes cuenta? Regístrate aquí';
            

            if(ocultarAlerta) {
                document.getElementById('alerta-auth').classList.add('d-none'); 
            }
        }

        async function procesarAuth() {
            const usuario = document.getElementById('auth-usuario').value;
            const password = document.getElementById('auth-password').value;
            const alerta = document.getElementById('alerta-auth');
            
            const endpoint = modoRegistro ? 'registrar' : 'login'; 

            try {
                const respuesta = await fetch(`https://localhost:7041/api/Auth/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombreUsuario: usuario, password: password })
                });

                if (respuesta.ok) {
                    if (modoRegistro) {
                        alerta.className = 'alert alert-success text-center animacion-suave';
                        alerta.innerText = '¡Cuenta creada con éxito! Ahora puedes iniciar sesión.';
                        alerta.classList.remove('d-none');
                        

                        alternarModoAuth(false); 
                        document.getElementById('auth-password').value = ''; 
                    } else {
                        const datos = await respuesta.json();
                        localStorage.setItem('miTokenVIP', datos.token); 
                        mostrarApp();
                    }
                } else {
                    const mensajeError = await respuesta.text(); 
                    alerta.className = 'alert alert-danger text-center animacion-suave';
                    alerta.innerText = modoRegistro ? mensajeError : "Usuario o contraseña incorrectos 🛑";
                    alerta.classList.remove('d-none');
                }
            } catch (error) {
                alerta.className = 'alert alert-danger text-center animacion-suave';
                alerta.innerText = "Error conectando con el servidor.";
                alerta.classList.remove('d-none');
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('miTokenVIP'); 
            document.getElementById('app-principal').classList.add('d-none');
            
            const login = document.getElementById('login-pantalla');
            login.classList.remove('d-none');
            login.classList.add('animacion-suave'); 
            
            // Limpiamos los campos por seguridad
            document.getElementById('auth-usuario').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('alerta-auth').classList.add('d-none');
        }

        function mostrarApp() {
            document.getElementById('login-pantalla').classList.add('d-none');
            
            const app = document.getElementById('app-principal');
            app.classList.remove('d-none');
            app.classList.add('animacion-suave'); 
            
            obtenerDatos(); 
        }

        // LOGICA DE LA API (AHORA SEGURA)
        function obtenerDatos() {
            fetch('https://localhost:7041/api/Gastos', { headers: getAuthHeaders() })
                .then(respuesta => {
                    if(respuesta.status === 401) { cerrarSesion(); throw new Error("Sesión expirada"); }
                    return respuesta.json();
                })
                .then(datos => {
                    listaGastosGlobal = datos; 
                    const lista = document.getElementById('lista-gastos');
                    lista.innerHTML = ''; 
                    
                    datos.forEach(gasto => {
                        let fechaLimpia = gasto.fecha.split('T')[0]; 
                        lista.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center lista-gastos-item border-0 border-bottom bg-transparent">
                                <div>
                                    <h6 class="mb-0 fw-bold">${gasto.descripcion}</h6>
                                    <small class="text-secondary">${gasto.categoria} | ${fechaLimpia}</small>
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="fw-bold me-3">$${gasto.monto}</span>
                                    <button class="btn btn-sm btn-outline-warning border-0 me-1" onclick="prepararEdicion(${gasto.id})" title="Editar">✏️</button>
                                    <button class="btn btn-sm btn-outline-danger border-0" onclick="eliminarGasto(${gasto.id})" title="Eliminar">🗑️</button>
                                </div>
                            </li>`;
                    });
                    
                    cargarTotal(); 
                    actualizarGrafico(); 
                })
                .catch(error => console.log(error));
        }

        function cargarTotal() {
            fetch('https://localhost:7041/api/Gastos/total', { headers: getAuthHeaders() })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById('balance').innerText = datos.total;
                });
        }

        // --- LOGICA DEL GRAFICO ---
        function actualizarGrafico() {
            const totalesPorCategoria = {};
            listaGastosGlobal.forEach(gasto => {
                if (!totalesPorCategoria[gasto.categoria]) { totalesPorCategoria[gasto.categoria] = 0; }
                totalesPorCategoria[gasto.categoria] += gasto.monto;
            });

            const etiquetas = Object.keys(totalesPorCategoria); 
            const valores = Object.values(totalesPorCategoria); 

            const ctx = document.getElementById('graficoGastos').getContext('2d');
            if (miGraficoVisual !== null) { miGraficoVisual.destroy(); }

            miGraficoVisual = new Chart(ctx, {
                type: 'doughnut', 
                data: {
                    labels: etiquetas,
                    datasets: [{
                        data: valores,
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // --- LOGICA DE EDICION Y GUARDADO ---
        function prepararEdicion(id) {
            const gasto = listaGastosGlobal.find(g => g.id === id);
            document.getElementById('desc').value = gasto.descripcion;
            document.getElementById('monto').value = gasto.monto;
            document.getElementById('cat').value = gasto.categoria;
            document.getElementById('fecha').value = gasto.fecha.split('T')[0];
            gastoEnEdicionId = id;

            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = '✏️ Actualizar Movimiento';
            btnGuardar.classList.remove('btn-marca');
            btnGuardar.classList.add('btn-warning');

            document.getElementById('btn-cancelar').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            gastoEnEdicionId = null;
            document.getElementById('desc').value = '';
            document.getElementById('monto').value = '';
            document.getElementById('cat').value = '';
            document.getElementById('fecha').value = '';

            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = 'Registrar Movimiento';
            btnGuardar.classList.remove('btn-warning');
            btnGuardar.classList.add('btn-marca');

            document.getElementById('btn-cancelar').classList.add('d-none');
        }

        function guardarGasto() {
            const descripcion = document.getElementById('desc').value;
            const monto = document.getElementById('monto').value;
            const categoria = document.getElementById('cat').value;
            const fechaInput = document.getElementById('fecha').value; 
            const fechaFinal = fechaInput ? fechaInput : new Date().toISOString(); 

            const payload = {
                descripcion: descripcion,
                monto: parseFloat(monto),
                categoria: categoria,
                fecha: fechaFinal 
            };

            if (gastoEnEdicionId === null) {
                fetch('https://localhost:7041/api/Gastos', {
                    method: 'POST',
                    headers: getAuthHeaders(), 
                    body: JSON.stringify(payload) 
                }).then(respuesta => procesarRespuesta(respuesta));
            } else {
                payload.id = gastoEnEdicionId; 
                fetch(`https://localhost:7041/api/Gastos/${gastoEnEdicionId}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(), 
                    body: JSON.stringify(payload) 
                }).then(respuesta => procesarRespuesta(respuesta));
            }
        }

        async function procesarRespuesta(respuesta) {
            const alertaErrores = document.getElementById('alerta-errores');

            if(respuesta.ok) {
                alertaErrores.classList.add('d-none'); 
                cancelarEdicion(); 
                obtenerDatos(); 
            } else {
                const datosError = await respuesta.json();
                let textoErrores = "<strong>¡Fuego amigo! Corrige lo siguiente:</strong><br><ul class='mb-0'>";
                if (datosError.errors) {
                    for (let campo in datosError.errors) {
                        textoErrores += `<li>${datosError.errors[campo][0]}</li>`;
                    }
                } else {
                    textoErrores += "<li>Revisa que los datos no estén vacíos o sean incorrectos.</li>";
                }
                textoErrores += "</ul>";
                alertaErrores.innerHTML = textoErrores;
                alertaErrores.classList.remove('d-none');
            }
        }

        function eliminarGasto(id) {
            if (confirm("¿Estás seguro de que quieres eliminar este registro?")) {
                fetch(`https://localhost:7041/api/Gastos/${id}`, { 
                    method: 'DELETE',
                    headers: getAuthHeaders() 
                })
                .then(respuesta => {
                    if(respuesta.ok) { obtenerDatos(); } 
                });
            }
        }

        if (localStorage.getItem('miTokenVIP')) {
            mostrarApp();
        }

    </script>
</body>
</html>
